name: Scheduled IPO Video Automation

on:
  schedule:
    # Daily Run: 10:45 PM IST (17:15 UTC) - Every day (Mon - Sun, 7 days a week)
    # Off-peak GitHub runner window; all evening Indian market & IPO data is fully closed and published
    - cron: '15 17 * * *'

  # Manual on-demand trigger anytime via GitHub Actions UI
  workflow_dispatch:
    inputs:
      ipo_slug:
        description: 'Specific IPO slug to process (leave blank to auto-discover latest unworked IPO)'
        required: false
        default: ''
      force_render:
        description: 'Force re-render even if audio/scripts already exist'
        type: boolean
        default: false
      voice_id:
        description: 'Cartesia Voice ID (default: 47c38ca4-5f35-497b-b1a3-415245fb35e1)'
        required: false
        default: '47c38ca4-5f35-497b-b1a3-415245fb35e1'

permissions:
  contents: write

concurrency:
  group: ipo-video-automation
  cancel-in-progress: false

jobs:
  build-and-render:
    name: Auto Discover, Render 16:9 Video & Thumbnail, Cloud Archive
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Chromium & Graphics Dependencies for Headless Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            fonts-noto-color-emoji \
            fonts-liberation \
            || sudo apt-get install -y libasound2

      - name: Install NPM Dependencies
        run: npm ci

      - name: Execute Autonomous Full-Length Video & Thumbnail Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
          CARTESIA_API_KEY_1: ${{ secrets.CARTESIA_API_KEY_1 }}
          CARTESIA_API_KEY_2: ${{ secrets.CARTESIA_API_KEY_2 }}
          CARTESIA_API_KEY_3: ${{ secrets.CARTESIA_API_KEY_3 }}
          CARTESIA_API_KEY_4: ${{ secrets.CARTESIA_API_KEY_4 }}
          CARTESIA_API_KEY_5: ${{ secrets.CARTESIA_API_KEY_5 }}
          CARTESIA_API_KEY_6: ${{ secrets.CARTESIA_API_KEY_6 }}
          CARTESIA_API_KEY_7: ${{ secrets.CARTESIA_API_KEY_7 }}
          CARTESIA_API_KEY_8: ${{ secrets.CARTESIA_API_KEY_8 }}
          CARTESIA_API_KEY_9: ${{ secrets.CARTESIA_API_KEY_9 }}
          CARTESIA_API_KEY_10: ${{ secrets.CARTESIA_API_KEY_10 }}
          CARTESIA_API_KEY_11: ${{ secrets.CARTESIA_API_KEY_11 }}
          CARTESIA_API_KEY_12: ${{ secrets.CARTESIA_API_KEY_12 }}
          CARTESIA_API_KEY_13: ${{ secrets.CARTESIA_API_KEY_13 }}
          CARTESIA_API_KEY_14: ${{ secrets.CARTESIA_API_KEY_14 }}
          CARTESIA_API_KEY_15: ${{ secrets.CARTESIA_API_KEY_15 }}
          CARTESIA_API_KEY_16: ${{ secrets.CARTESIA_API_KEY_16 }}
          CARTESIA_API_KEY_17: ${{ secrets.CARTESIA_API_KEY_17 }}
          CARTESIA_API_KEY_18: ${{ secrets.CARTESIA_API_KEY_18 }}
          CARTESIA_API_KEY_19: ${{ secrets.CARTESIA_API_KEY_19 }}
          CARTESIA_API_KEY_20: ${{ secrets.CARTESIA_API_KEY_20 }}
          CARTESIA_API_KEY_21: ${{ secrets.CARTESIA_API_KEY_21 }}
          CARTESIA_API_KEY_22: ${{ secrets.CARTESIA_API_KEY_22 }}
          CARTESIA_API_KEY_23: ${{ secrets.CARTESIA_API_KEY_23 }}
          CARTESIA_API_KEY_24: ${{ secrets.CARTESIA_API_KEY_24 }}
          CARTESIA_API_KEY_25: ${{ secrets.CARTESIA_API_KEY_25 }}
          CARTESIA_API_KEYS: ${{ secrets.CARTESIA_API_KEYS }}
          CARTESIA_MODEL_ID: 'sonic-3.6'
          CARTESIA_VOICE_ID: ${{ github.event.inputs.voice_id || '47c38ca4-5f35-497b-b1a3-415245fb35e1' }}
          CARTESIA_LANGUAGE: 'en'
          BG_MUSIC_VOLUME: '0.05'
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
        run: |
          CLI_ARGS="--upload-drive"
          if [ -n "${{ github.event.inputs.ipo_slug }}" ]; then
            CLI_ARGS="$CLI_ARGS --ipo=${{ github.event.inputs.ipo_slug }}"
          fi
          if [ "${{ github.event.inputs.force_render }}" = "true" ]; then
            CLI_ARGS="$CLI_ARGS --force-scripts --force-audio"
          fi
          npm run pipeline -- $CLI_ARGS

      - name: Commit & Push Updated Trackers and IPO Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed_ipos.json
          [ -d "src/data" ] && git add src/data/
          [ -d "public/logos" ] && git add public/logos/
          if git diff --staged --quiet; then
            echo "✨ No new IPO data or tracker updates. Everything up-to-date."
          else
            git commit -m "chore(tracker): update processed IPOs and generated datasets [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Processed IPO tracker and datasets committed and pushed to main."
          fi
